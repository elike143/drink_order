# 這個專案要啟動的服務：一個叫 db 的 PostgreSQL 資料庫
# - image：使用 PostgreSQL 16 版的映像檔（安裝包）
# - env_file：從 .env 讀取帳號、密碼、資料庫名稱
# - ports：本機的 5432 對應到容器裡的 5432，而且只允許這台電腦（127.0.0.1）連
# - volumes：把資料庫的檔案存進名為 pgdata 的儲存空間，容器刪掉後資料還在
# - healthcheck：每 5 秒用 pg_isready 確認資料庫真的可以連線，連續失敗 5 次才判定為不健康
services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

# 宣告上面用到的儲存空間 pgdata，由 Docker 管理
volumes:
  pgdata:
